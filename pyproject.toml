[project]
name = "abep-sim"
version = "0.1.0"
description = "System-closure simulator for air-breathing electric propulsion (DRDO TDF DTDF/06/13516)"
# >= 3.11: the code uses tomllib and the locked environment (requirements-lock.txt: numpy 2.4.4, scipy 1.17.1,
# pandas 3.0.2) needs 3.11; CI runs 3.11 (docs/ci/PACKAGING.md).
requires-python = ">=3.11"
# pymsis is NOT a hard dependency (owner decision 2026-09-27, fo_repo_decisions_batch; docs/ci/PACKAGING.md): gate 1
# requires running without it (frozen NRLMSIS dataset is the default; live MSIS only when asked). Live MSIS:
# `pip install -e .[msis]`. requirements-lock.txt stays the dependency source of truth (it pins pymsis==0.13.0).
dependencies = ["numpy", "pandas", "pyyaml", "matplotlib", "scipy"]
[project.optional-dependencies]
msis = ["pymsis>=0.13"]
[project.scripts]
abep-sim = "abep_sim.programme.sweep:main"
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# Explicit package discovery (docs/ci/PACKAGING.md). Flat-layout auto-discovery refuses this repository
# ("Multiple top-level packages discovered in a flat-layout: ['abep_sim', 'hallthruster_bridge']").
# Only abep_sim (and any future abep_sim.* subpackage) is distributed. hallthruster_bridge/, docs/ and schemas/ are
# repository resources, not packages: the modules that read them locate them relative to the source tree
# (os.path.dirname(os.path.dirname(__file__))), which an editable install preserves.
[tool.setuptools.packages.find]
where = ["."]
include = ["abep_sim", "abep_sim.*"]
namespaces = false

# Frozen reference data shipped with the package (CLAUDE.md rule 1): atmosphere, intake surface, goldens, rate tables.
# Explicit file list (A9.17 DATA_SIZE, docs/decisions/OD_2026_10_01_A9_17_data_artifact_owner_decisions.json): the
# orbit-resolved atmosphere_msis21_orbit_v1.* (17 MB CSV, stored as .csv.gz) is repository evidence only. No installed
# production module imports abep_sim.atmosphere_orbit, so it is not shipped; its accessor raises a clear error naming
# the repository path when the data are absent.
[tool.setuptools.package-data]
abep_sim = ["data/atmosphere_msis21_v1.json", "data/atmosphere_msis21_v1.csv", "data/intake_surface_v1.json",
            "data/intake_surface_v1.csv", "data/golden_v1.json", "data/golden_v2.json", "data/rates/*.dat", "data/rates/*.md"]
[tool.setuptools.exclude-package-data]
# A9.17 WINDS + DATA_SIZE: the HWM14-wind atmosphere v2 (atmosphere_msis21_hwm14_orbit_v2.*) is repository evidence too.
abep_sim = ["data/atmosphere_msis21_orbit_v1*", "data/atmosphere_msis21_hwm14_orbit_v2*"]
