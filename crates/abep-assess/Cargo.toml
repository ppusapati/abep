[package]
name = "abep-assess"
description = "Assessment layer of the ABEP Rust simulator (SC-WP-11): HC gates, the RFP P_bus gate, statewise requirement mapping, RVM rules, GNG-ICP-01, HC-05 and the RFP constraint matrix. Consumes raw physics records; never modifies them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "abep-assess-parity"
path = "src/bin/abep_assess_parity.rs"

[[bin]]
name = "abep-assess-matrix"
path = "src/bin/abep_assess_matrix.rs"

[[bin]]
name = "abep-assess-closure"
path = "src/bin/abep_assess_closure.rs"

[[bin]]
name = "abep-assess-icp-closure"
path = "src/bin/abep_assess_icp_closure.rs"

[[bin]]
name = "abep-assess-power-closure"
path = "src/bin/abep_assess_power_closure.rs"

[[bin]]
name = "abep-assess-thermal-closure"
path = "src/bin/abep_assess_thermal_closure.rs"

[[bin]]
name = "abep-assess-dcr003"
path = "src/bin/abep_assess_dcr003.rs"

[[bin]]
name = "abep-assess-envelope-summary"
path = "src/bin/abep_assess_envelope_summary.rs"

[dependencies]
abep-types.workspace = true
abep-provenance.workspace = true
abep-config.workspace = true
abep-data.workspace = true
abep-hall.workspace = true
abep-atmos.workspace = true
# Hall AIR reaction-set admission state (NP-HALL-CHEM-AIR, abep_chem::hall_air) read by the closure's P-HALL-AIR path.
abep-chem.workspace = true
# Admitted physics crates consumed (never duplicated): only this crate and abep-cli use them as plain path dependencies.
abep-mission = { path = "../abep-mission" }
abep-gaspath = { path = "../abep-gaspath" }
abep-subsystems = { path = "../abep-subsystems" }
abep-icp = { path = "../abep-icp" }
# Admitted F7 design chain (F1 consumer view, plenum of (V, wall)) read by the addendum A5 intake closure.
abep-design = { path = "../abep-design" }
# IF-ICP-BUS-v2 records are serde_json values (abep_subsystems::power::icp_bus::icp_upstream_loads_v2; closure_m1 P-PBUS).
serde_json.workspace = true

[dev-dependencies]
# CI replay of the gzip-captured reference outputs (serde_json is a normal dependency above).
flate2.workspace = true
