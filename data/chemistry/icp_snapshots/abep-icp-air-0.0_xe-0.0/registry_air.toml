# IF-CHEM-REG-v1 species and process registry, mode AIR (NP-ICP-CHEM-AIR v1, build plan BP-S1; label abep-icp-air-0.0).
# Every contract process of this mode appears once, with the status, tier, class and reaction text the contract
# records (prereg_v1.json processes[]); abep_chem::registry refuses any difference (MODEL_ERROR). A channel is one
# registered representation of a process (one table or one variant member); a process without a channel has no
# usable data. Schema: registry_schema_v1.json. Maintained by hand, one table per commit (build plan per_table_commit).
