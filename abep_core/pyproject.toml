[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "abep_core"
version = "0.1.0"
description = "Optional native TPMC kernels for ABEP-VLEO (A9.7 Rust lane); the Python reference is authoritative"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.maturin]
features = ["extension-module"]
module-name = "abep_core"
