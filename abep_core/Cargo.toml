[package]
name = "abep_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "Optional native kernels for ABEP-VLEO (A9.7 Rust lane): TPMC channel trace. The Python reference abep_sim/intake_tpmc.py is authoritative."
publish = false

[lib]
name = "abep_core"
crate-type = ["cdylib", "rlib"]

[features]
# maturin enables `extension-module` (pyproject.toml). Plain `cargo test` builds and tests the pure-Rust physics in
# src/tpmc.rs and src/rng.rs without linking Python.
python = ["dep:pyo3", "dep:numpy"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29", optional = true }
numpy = { version = "0.29", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
