# Reaction-set label of the Hall AIR_PRIMARY chemistry (NP-HALL-CHEM-AIR v1, A9.33 Q2). Separate from abep-n2n-* (propellants/,
# PINNED.toml) and abep-icp-air-* (data/chemistry/icp/): one label never names two chemistry definitions (HR-02). [files] pins
# every file of this directory, [reuse] the abep-n2n-0.11 tables referenced in place (../propellants/<file>), [tables] the set's
# own tables (target gas, preregistration process, role, origin). Any change is a new label with a history line, one table per
# commit, and a new sha256 of this file in abep_chem::hall_air::AIR_PINNED_SHA256. Status vocabulary: INCOMPLETE_EVIDENCE |
# NOT_REPRESENTABLE_IN_PINNED_SOLVER | COMPLETE_FOR_PARAMETRIC_ENVELOPE (not a validation claim).

[contract]
id = "NP-HALL-CHEM-AIR"
version = "1"
prereg = "docs/rust_migration/new_physics/NP-HALL-CHEM-AIR/prereg_v1.json"
lock = "docs/rust_migration/new_physics/NP-HALL-CHEM-AIR/prereg_lock_v1.json"
lock_sha256 = "1884e42ff98ee07a634500ce338eef9dc3749bf4e5c053b058aec9b764674518"
consumer = "NP-HALL-PARAMETRIC-ENVELOPE AIR family (addendum); bridge_lib.jl chemistry_validity through rate_dir = propellants_air"
loader = "abep_chem::hall_air::AirSet::load"

[reaction_set]
label = "abep-air-0.2"
status = "INCOMPLETE_EVIDENCE"
nominal_config = "air_nominal.toml"
configs = ["air_nominal.toml", "air_alt.toml"]
tier1_gaps = [
  "HA-O-EL-01",
  "HA-O-EXC-01",
  "HA-O2-ION-01",
  "HA-O2-DI-01",
  "HA-O2-DIS-01",
  "HA-O2-EL-01",
  "HA-O2-EXC-01",
  "HA-O2-EXC-02",
]
blocking = [
  "SONG2026 tables not checked against the version of record (AD-HA-02, OQ-HA-01)",
  "SB-NO unresolved: blocks every AIR state (AD-HA-05, OQ-HA-03)",
  "SB-He / SB-Ar unresolved: 14 + 6 states INCOMPLETE_EVIDENCE (AD-HA-05, OQ-HA-03)",
  "CA-HALL-AIR-v1 PREPARED_NOT_RUN: no final tier-2 / tier-3 verdict (AD-HA-04)",
  "no repository source for HA-IM-01, HA-HN-01, HA-DR-01, HA-MS-01, HA-O2P-DIS-01, HA-O2-VIB-01, HA-O2-EXC-03: no evaluable bound today (UNBOUNDED_OMISSION unless sourced or disposed, OQ-HA-06)",
]
history = [
  "abep-air-0.0 (2026-10-08): skeleton under NP-HALL-CHEM-AIR v1 (lock 1884e42f): the 29 abep-n2n-0.11 tables (n2_n.toml nominal + N2 DI lower + N elastic Wang) referenced in place with mirrored validity entries; no O / O2 table; no configuration",
  "abep-air-0.1 (2026-10-08): + O ionization HA-O-ION-01 nominal ionization_O_beb_kd2002.dat (Kim & Desclaux 2002 BEB via NIST SRD 107; byte-identical copy of the v0 table, validity 255 eV); new configuration air_nominal.toml = the 29 n2_n.toml reactions referenced in place + O (max_charge 1); correction to the 0.0 line: [reuse] holds 31 tables (n2_n.toml's 29 + N2 DI lower + N elastic Wang), not 29",
  "abep-air-0.2 (2026-10-08): + O ionization variant ionization_O_thompson1995.dat (Thompson et al. 1995 via NIST SRD 107; byte-identical copy of the v0 table, validity 255 eV); new configuration air_alt.toml (AIR-ALT: Thompson O ionization, N2 DI lower, N elastic Wang); rest as 0.1",
]

