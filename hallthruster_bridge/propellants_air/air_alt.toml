# AIR_PRIMARY Hall propellant for HallThruster.jl v0.23.1, reaction set in AIR_PINNED.toml (NP-HALL-CHEM-AIR v1). Rate files are Maxwellian tables vs mean energy (3/2 Te).
# N2 / N block = hallthruster_bridge/propellants/n2_n.toml (abep-n2n-0.11) referenced in place with the AIR-ALT members (N2 DI lower, N elastic Wang BSR).
# AIR-ALT: the alternative member of every unweighted pair (O ionization Thompson, O2 DI lower, N2 DI lower, N elastic Wang); used by the CA-HALL-AIR-v1 audit as a nuisance configuration.
# Anode flows, inlet velocities and temperatures are set per species by the AIR case (Propellant objects); the values below are not used by an AIR run.
# Not admitted: AIR_PINNED.toml status (tier-1 gaps: O momentum transfer, O excitation, O2 electronic excitation, ...).

[[species]]
symbol = "N"
name = "Nitrogen"
max_charge = 2                                      # atomic N^2+ (N_Z2plus) promoted by the pre-registered audit (abep-n2n-0.5)
gamma = 1.666667
mass = 14.0067
flow_rate_kg_s = 0.0
temperature_K = 500.0

[[species]]
symbol = "N2"
name = "Molecular Nitrogen"
max_charge = 1
gamma = 1.4
mass = 28.0134
flow_rate_kg_s = 5e-6
temperature_K = 500.0

[[species]]
symbol = "O"
name = "Oxygen"
max_charge = 1                                      # O(2+) not configured: no one-to-one link source (NP-HALL-CHEM-AIR L-06)
gamma = 1.666667
mass = 15.999
flow_rate_kg_s = 0.0
temperature_K = 500.0

[[species]]
symbol = "O2"
name = "Molecular Oxygen"
max_charge = 1
gamma = 1.4
mass = 31.998
flow_rate_kg_s = 0.0
temperature_K = 500.0

[[reactions]]
type = "elastic"
target_species = "N2"
rate_coeff_file = "../propellants/elastic_N2_song2023.dat"   # Song et al. JPCRD 2023 Table 5 MTCS (abep-n2n-0.3; replaces shipped elastic_N2.dat)

[[reactions]]
type = "electron_impact"
equation = "N2 + e -> N2(+) + 2e"
rate_coeff_file = "../propellants/ionization_N2_song2023.dat"   # Song et al. JPCRD 2023 Table 10 sigma(N2+) (abep-n2n-0.2; replaces shipped ionization_N2_N2+.dat)

[[reactions]]
type = "electron_impact"
equation = "N2 + e -> N(+) + N + 2e"
rate_coeff_file = "../propellants/dissociative_ionization_N2_lower.dat"   # N2 DI lower variant (abep-n2n-0.4)

[[reactions]]
type = "electron_impact"
equation = "N2 + e -> N(2+) + N + 3e"
rate_coeff_file = "../propellants/dissociative_ionization_N2_to_N_Z2plus.dat"   # Song 2023 Table 10 sigma(N++), ramp from 53.885 eV (abep-n2n-0.6)

[[reactions]]
type = "electron_impact"
equation = "N2 + e -> N + N + e"
rate_coeff_file = "../propellants/dissociation_N2.dat"   # Song et al. JPCRD 2023 Table 9 (Cosby 1993); header 12.14 eV (PROVENANCE.md)

[[reactions]]
type = "excitation"
target_species = "N2"
rate_coeff_file = "../propellants/excitation_N2_A3Sigma_u.dat"   # Su 2021 (<20 eV) + Johnson 2005 (>=20 eV), dE = 7.75 eV (abep-n2n-0.9)

