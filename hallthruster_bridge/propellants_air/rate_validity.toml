# Validity domain of each rate table of the Hall AIR reaction set (NP-HALL-CHEM-AIR, hallthruster_bridge/propellants_air/),
# read by bridge_lib.jl chemistry_validity through each AIR case's rate_dir. Same convention as
# hallthruster_bridge/propellants/rate_validity.toml: status = "verified" with max_mean_energy_eV = the highest mean electron
# energy (3/2 T_e, eV) at which the Maxwellian rate share resting beyond the last cited cross-section point is < 1 %, capped at
# 255 eV; status = "unresolved" = domain not audited (any run using the file is not chemistry_trustworthy). A file named by an
# AIR configuration without an entry is an error, never a default (HR-05). The audited chemistry domain (45 eV mean energy,
# DOM-AIR-02) is a separate check. Entries keyed ../propellants/<file> mirror the abep-n2n-0.11 entries byte for byte in
# meaning (status, limit, basis); abep_chem::hall_air refuses a mirror that differs.

