# Validity domain of each rate table, as the highest mean electron energy (3/2 T_e, eV) up to which the table rests on
# its cited cross sections rather than on an extrapolation. Read by bridge_lib.jl: a run whose chemistry-active region
# reaches beyond the lowest limit in its reaction set is not chemistry_trustworthy. Every rate file named in a propellant
# config must have an entry here (no default). 255 eV = the whole HallThruster.jl rate grid (0-255 eV).

