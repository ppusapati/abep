# Validity domain of each rate table, read by bridge_lib.jl (chemistry_validity). Every rate file named in a propellant
# config must have an entry here; a missing entry is a driver error, never a default.
#   status = "verified":   max_mean_energy_eV is the highest mean electron energy (3/2 T_e, eV) at which the part of the
#                          Maxwellian rate resting beyond the last cited cross-section point is < 1 %, capped at 255 eV
#                          (HallThruster.jl interpolates tables on 0-255 eV and holds the end value beyond).
#   status = "unresolved": the domain has not been audited. Any run using the file is NOT chemistry_trustworthy.
# A run is chemistry_trustworthy only if, over every saved frame of the averaging window, no reaction has activity
# n_e n_target k_r at cells where 3/2 T_e exceeds its limit (f_out = 0 within 1e-12), and no file is unresolved.

["dissociation_N2.dat"]
status = "verified"
max_mean_energy_eV = 45.0
basis = "JPCRD 2023 Table 9 ends at 200 eV; held tail carries 0.95 % of the rate at 45 eV mean energy (T_e = 30 eV), 3.8 % at 60 eV (scripts/build_n2_dissociation_table.py)"

["dissociative_ionization_N2_upper.dat"]
status = "verified"
max_mean_energy_eV = 255.0
basis = "JPCRD 2023 Table 10 sigma(N+ + N2++) spans 30-1000 eV (ramp from 24.284 eV); held-tail share < 1 % at 255 eV mean energy (scripts/build_n2_dissociative_ionization_table.py)"

["dissociative_ionization_N2_lower.dat"]
status = "verified"
max_mean_energy_eV = 255.0
basis = "as the upper variant, minus 0.01 x sigma_total (JPCRD Sec. 2.8 N2++ statement); held-tail share < 1 % at 255 eV mean energy"

["ionization_N+_N2+.dat"]
status = "verified"
max_mean_energy_eV = 255.0
basis = "Bell et al. JPCRD 1983 Eq. (1) N II (+-10 %), analytic Bethe form evaluated 29.60 eV-10 keV; held-tail share 0.0000 % at 255 eV mean energy (scripts/build_n_plus_ionization_table.py)"

["ionization_N.dat"]
status = "verified"
max_mean_energy_eV = 255.0
basis = "NIST SRD 107 Kim & Desclaux N(4S) tabulation spans 15-5000 eV (audited 2026-09-26); held-tail share 0.0000 % up to 300 eV mean energy"

["ionization_N2_song2023.dat"]
status = "verified"
max_mean_energy_eV = 255.0
basis = "JPCRD 2023 Table 10 sigma(N2+) spans 16-1000 eV; held-tail share 0.96 % at 255 eV mean energy, 0.22 % at 200 eV (scripts/build_n2_ionization_song2023_table.py)"

["ionization_N2_N2+.dat"]
status = "unresolved"
basis = "shipped with HallThruster.jl v0.23.1, citing Itikawa 2006 (reactions/CITATIONS.md); table spans 0-300 eV mean energy, but the cross-section input and its energy extent are not in the package, so the tail cannot be audited. Superseded in n2_n.toml by ionization_N2_song2023.dat (abep-n2n-0.2); kept for provenance"

["elastic_N2_song2023.dat"]
status = "verified"
max_mean_energy_eV = 255.0
basis = "JPCRD 2023 Table 5 MTCS spans 0.001 eV-10 keV; held-tail share 0.000000 % at 255 eV mean energy (scripts/build_n2_elastic_song2023_table.py)"

["elastic_N2.dat"]
status = "unresolved"
basis = "shipped with HallThruster.jl v0.23.1, citing Itikawa 2006; table stops at 100 eV mean energy (the solver holds the 100 eV value beyond), and the cross-section input is not in the package. Superseded in n2_n.toml by elastic_N2_song2023.dat (abep-n2n-0.3); kept for provenance"
