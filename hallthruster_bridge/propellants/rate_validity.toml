# Validity domain of each rate table, read by bridge_lib.jl (chemistry_validity). Every rate file named in a propellant
# config must have an entry here; a missing entry is a driver error, never a default.
#   status = "verified":   max_mean_energy_eV is the highest mean electron energy (3/2 T_e, eV) at which the part of the
#                          Maxwellian rate resting beyond the last cited cross-section point is < 1 %, capped at 255 eV
#                          (HallThruster.jl interpolates tables on 0-255 eV and holds the end value beyond).
#   status = "unresolved": the domain has not been audited. Any run using the file is NOT chemistry_trustworthy.
# chemistry_trustworthy = true means no reaction was evaluated outside its declared chemistry-model domain; it does NOT mean
# every reaction has experimental confirmation (see each basis).
# A run is chemistry_trustworthy only if, over every saved frame of the averaging window, no reaction has activity
# n_e n_target k_r at cells where 3/2 T_e exceeds its limit (f_out = 0 within 1e-12), and no file is unresolved.

