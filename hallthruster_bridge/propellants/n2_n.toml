# N2/N propellant for HallThruster.jl v0.23.1 (Stage A). Reaction-set version: PINNED.toml [reaction_set]. Rate files are Maxwellian tables vs mean energy (3/2 Te).
[[species]]
symbol = "N"
name = "Nitrogen"
max_charge = 2                                      # N2+ promoted by the pre-registered audit (abep-n2n-0.5)
gamma = 1.666667
mass = 14.0067
flow_rate_kg_s = 0.0
temperature_K = 500.0

[[species]]
symbol = "N2"
name = "Molecular Nitrogen"
max_charge = 1
gamma = 1.4
mass = 28.0134
flow_rate_kg_s = 5e-6
temperature_K = 500.0

[[reactions]]
type = "elastic"
target_species = "N2"
rate_coeff_file = "elastic_N2_song2023.dat"         # Song et al. JPCRD 2023 Table 5 MTCS (abep-n2n-0.3; replaces shipped elastic_N2.dat)

[[reactions]]
type = "electron_impact"
equation = "N2 + e -> N2(+) + 2e"
rate_coeff_file = "ionization_N2_song2023.dat"      # Song et al. JPCRD 2023 Table 10 sigma(N2+) (abep-n2n-0.2; replaces shipped ionization_N2_N2+.dat)

[[reactions]]
type = "electron_impact"
equation = "N2 + e -> N(+) + N + 2e"
rate_coeff_file = "dissociative_ionization_N2_upper.dat"  # Song 2023 Table 10 sigma(N+ + N2++), upper variant (abep-n2n-0.4); lower variant: n2_n_di_lower.toml

[[reactions]]
type = "electron_impact"
equation = "N2 + e -> N(2+) + N + 3e"
rate_coeff_file = "dissociative_ionization_N2_N2+.dat"  # Song 2023 Table 10 sigma(N++), ramp from 53.885 eV (abep-n2n-0.6)

[[reactions]]
type = "electron_impact"
equation = "N2 + e -> N + N + e"
rate_coeff_file = "dissociation_N2.dat"             # Song et al. JPCRD 2023 Table 9 (Cosby 1993); header 12.14 eV (PROVENANCE.md)

[[reactions]]
type = "excitation"
energy_eV = 9.37
target_species = "N2"
rate_coeff_file = "excitation_N2.dat"               # REQUIRED: lumped electronic + vibrational (Itikawa 2006) — not yet generated

[[reactions]]
type = "elastic"
target_species = "N"
rate_coeff_file = "elastic_N.dat"                   # REQUIRED — not yet generated

[[reactions]]
type = "electron_impact"
equation = "N + e -> N(+) + 2e"
rate_coeff_file = "ionization_N.dat"                # Kim & Desclaux 2002 BEB via NIST SRD 107 (PROVENANCE.md)

[[reactions]]
type = "electron_impact"
equation = "N(+) + e -> N(2+) + 2e"
rate_coeff_file = "ionization_N+_N2+.dat"           # Bell et al. JPCRD 1983 Eq. (1), N II (abep-n2n-0.5)
