# HallThruster.jl is the authoritative Hall-discharge solver (offline). Every generated map must carry this block.
[hallthruster]
package = "HallThruster.jl"
repository = "https://github.com/UM-PEPL/HallThruster.jl"
version = "0.23.1"
commit = "bfb3019fc74ceaa2c70c9d3b19236a83a44ee3b5"   # recovered from the release tarball (git get-tar-commit-id)
licence = "MIT"
molecular_support = "propellant_config TOML; electron-impact dissociation / ionization / dissociative ionization (docs/src/howto/new_propellant.md)"
defaults_used = "anom_model TwoZoneBohm(1/160, 1/16); wall_loss_model WallSheath(BNSiO2, 1.0)"

upgrade_policy = "An upstream release (including a fix for the background_pressure_Torr units issue, upstream/ingestion_units_issue.md) never moves this pin automatically. Treat any upgrade as a physics-model change: bump the pin on a branch, rerun the P5 validation cases (both comparison modes), compare with the logged v0.23.1 results, record the differences in docs/HISTORY.md, and only then accept. Drop the 133.322 factor in run_cases.jl only if the new version converts Torr itself."

[julia]
minimum = "1.10"
install = "https://julialang.org/downloads  (tested with 1.11.7 from julialang-s3.julialang.org, 2026-09-25)"

[reaction_set]
# Any change to which rate files n2_n.toml uses, or to their contents, is a reaction-set model change: bump the version
# and add a history line. A version label never refers to two different chemistry definitions.
version = "abep-n2n-0.2"
status = "INCOMPLETE — N2 excitation (8 states) and N elastic (momentum transfer) still required; N2 elastic is the HallThruster-shipped table (unresolved validity)"
history = [
  "abep-n2n-0.1: N2 ionization + N2 elastic shipped with HallThruster.jl (Itikawa 2006); N ionization (Kim & Desclaux via NIST, 2026-09-25); N2 dissociation (Song 2023 Table 9, 2026-09-26)",
  "abep-n2n-0.2 (2026-09-26): N2 ionization -> ionization_N2_song2023.dat (Song et al. JPCRD 2023 Table 10 sigma(N2+)); rest as 0.1",
]
